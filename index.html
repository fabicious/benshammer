<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wann fällt der Benshammer?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b1f;
    --fg: #f4f4ff;
    --muted: #8f8fc8;
    --accent: #ffd800;
    --accent2: #ff2e63;
    --panel: #14143a;
    --edge: #4a4ae0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(74,74,224,.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,74,224,.12) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--fg);
    font-family: "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
    overflow-x: hidden;
    image-rendering: pixelated;
  }
  /* CRT scanlines + vignette */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  /* Phase "party": 21.-23.01.2027 */
  body.party { animation: flash .5s steps(1) infinite; }
  @keyframes flash {
    0%   { background-color: #0b0b1f; }
    20%  { background-color: #ff2e63; }
    40%  { background-color: #ffd800; }
    60%  { background-color: #2eff9a; }
    80%  { background-color: #4a4ae0; }
  }
  @media (prefers-reduced-motion: reduce) { body.party { animation: none; background-color: #3a0f3a; } }
  #rain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; display: none; }
  body.rain #rain { display: block; }
  h1 {
    font-size: clamp(1.1rem, 4.4vw, 2.4rem);
    line-height: 1.4;
    text-align: center;
    margin: 0 0 12px;
    color: var(--accent);
    text-shadow: 4px 4px 0 var(--accent2), 8px 8px 0 #000;
  }
  .sub { color: var(--muted); text-align: center; margin: 0 0 28px; font-size: .65rem; line-height: 1.8; }
  .sub::after { content: "_"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  main {
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: stretch;
  }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }

  .stage {
    position: relative;
    aspect-ratio: 540 / 560;
    width: 100%;
    background: #070718;
    border: 4px solid var(--edge);
    box-shadow: 0 0 0 4px #000, 8px 8px 0 4px #000;
    overflow: hidden;
  }
  .stage svg { display: block; width: 100%; height: 100%; }
  #hammer {
    transform-origin: 90px 450px;
    transition: transform 1s steps(12, end);
  }
  .stage.hit { animation: shake .5s steps(2) 3; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-8px, 4px); }
    75% { transform: translate(8px, -4px); }
  }
  .pct {
    position: absolute; top: 10px; right: 12px;
    font-size: .7rem; color: var(--accent);
    background: #000; padding: 6px 8px; border: 2px solid var(--accent);
  }

  .info { display: flex; flex-direction: column; gap: 24px; justify-content: center; }
  .count { text-align: center; }
  .count .num {
    font-size: clamp(4rem, 15vw, 7.5rem);
    line-height: 1.1;
    color: var(--accent);
    text-shadow: 6px 6px 0 var(--accent2), 12px 12px 0 #000;
  }
  .count .label { font-size: 1rem; margin-top: 16px; color: var(--fg); text-transform: uppercase; letter-spacing: .2em; }
  .bar {
    height: 28px; background: #000; padding: 4px;
    border: 4px solid var(--edge);
    box-shadow: 4px 4px 0 #000;
  }
  .bar > div {
    height: 100%; width: 0; transition: width .8s steps(10, end);
    background: repeating-linear-gradient(90deg, var(--accent) 0 12px, var(--accent2) 12px 16px, transparent 16px 20px);
  }
  .trivia {
    background: var(--panel);
    border: 4px solid var(--edge);
    box-shadow: 0 0 0 4px #000, 8px 8px 0 4px #000;
    padding: 18px;
    line-height: 1.8;
  }
  .trivia h2 { margin: 0 0 12px; font-size: .65rem; color: var(--accent2); letter-spacing: .1em; text-transform: uppercase; }
  .trivia h2::before { content: "\25B6  "; color: var(--accent); }
  .trivia p { margin: 0; font-size: .7rem; }
</style>
</head>
<body>
  <canvas id="rain"></canvas>
  <h1>Wann fällt der Benshammer?</h1>
  <p class="sub">Der Hammer fällt am 21. Januar 2027.</p>

  <main>
    <div class="stage" id="stage" aria-label="Fortschritt: Hammer schwingt Richtung Amboss">
      <div class="pct" id="pct">0 %</div>
      <svg viewBox="0 0 540 560" aria-hidden="true" shape-rendering="crispEdges">
        <g id="gauge"></g>
        <!-- Gin Tonic -->
        <g transform="translate(450 520) scale(.4) translate(-450 -520)">
        <rect x="390" y="400" width="120" height="120" fill="#cfeaff" fill-opacity=".25"/>
        <rect x="398" y="420" width="104" height="92" fill="#d9f4ee" fill-opacity=".85"/>
        <rect x="398" y="420" width="104" height="8" fill="#ffffff" fill-opacity=".7"/>
        <rect x="412" y="436" width="30" height="30" fill="#ffffff" fill-opacity=".8"/>
        <rect x="456" y="452" width="30" height="30" fill="#ffffff" fill-opacity=".8"/>
        <rect x="424" y="480" width="26" height="26" fill="#ffffff" fill-opacity=".7"/>
        <rect x="428" y="446" width="4" height="4" fill="#fff"/>
        <rect x="470" y="490" width="4" height="4" fill="#fff"/>
        <rect x="486" y="430" width="4" height="4" fill="#fff"/>
        <rect x="390" y="400" width="6" height="120" fill="#fff" fill-opacity=".6"/>
        <rect x="504" y="400" width="6" height="120" fill="#fff" fill-opacity=".6"/>
        <rect x="390" y="514" width="120" height="6" fill="#fff" fill-opacity=".6"/>
        <!-- Limette -->
        <rect x="496" y="404" width="40" height="8" fill="#3fae2a"/>
        <rect x="500" y="412" width="32" height="8" fill="#a8e063"/>
        <rect x="508" y="420" width="16" height="8" fill="#3fae2a"/>
        <!-- Strohhalm -->
        <rect x="440" y="380" width="8" height="100" fill="#ff2e63"/>
        <rect x="420" y="372" width="28" height="8" fill="#ff2e63"/>
        </g>
        <g id="hammer">
          <rect x="78" y="90" width="24" height="372" fill="#b5651d"/>
          <rect x="78" y="90" width="8" height="372" fill="#c98551"/>
          <rect x="74" y="430" width="32" height="32" fill="#5b3a1f"/>
          <rect x="20" y="60" width="140" height="60" fill="#8a93a6"/>
          <rect x="20" y="60" width="140" height="16" fill="#b7bfd0"/>
          <rect x="20" y="106" width="140" height="14" fill="#5d6577"/>
          <rect x="8" y="64" width="20" height="52" fill="#6c7487"/>
          <rect x="152" y="64" width="20" height="52" fill="#6c7487"/>
        </g>
        <rect x="80" y="440" width="20" height="20" fill="#ffd800"/>
      </svg>
    </div>

    <div class="info">
      <div class="count">
        <div class="num" id="days">–</div>
        <div class="label" id="label">Tage</div>
      </div>
      <div>
        <div class="bar"><div id="fill"></div></div>
      </div>
      <div class="trivia">
        <h2>Nerd-Wissen</h2>
        <p id="trivia"></p>
      </div>
    </div>
  </main>

<script>
// Index = verbleibende Tage (0..70)
const TRIVIA = [

/* 13 */ "In Fallout ist Vault 13 die Heimat des ersten Protagonisten – eine Vault ohne Experiment, dafür mit kaputtem Wasserchip.",

/* 19 */ "Kirby-Erfinder Masahiro Sakurai war bei Kirby's Dream Land erst 19 Jahre alt.",
/* 20 */ "Baldur's Gate 3 nutzt das Regelwerk von Dungeons & Dragons – und damit den 20-seitigen Würfel (W20).",

/* 22 */ "Der Kill-Screen von Donkey Kong liegt bei Level 22 – danach stirbt Mario nach Sekunden.",
/* 23 */ "FIFA 23 war das letzte FIFA-Spiel von EA – danach hieß die Reihe EA Sports FC.",

/* 25 */ "Half-Life wurde im November 2023 stolze 25 Jahre alt.",
/* 26 */ "Die Atari 2600 (1977) trägt die 26 im Namen – das Modell hieß CX2600.",
/* 27 */ "Doom (1993) bestand in der Vollversion aus 3 Episoden mit je 9 Levels – zusammen 27 Level.",

/* 54 */ "Vor 54 Jahren (1972) kamen Pong und die Magnavox Odyssey, die erste Heimkonsole, auf den Markt.",

/* 66 */ "Vor 66 Jahren (1960) lieferte DEC den ersten PDP-1-Computer aus – auf dem später Spacewar! lief.",
/* 67 */ "Ende der 50er traf sich der Tech Model Railroad Club am MIT – dort entstand die frühe Hacker-Kultur.",
/* 68 */ "Vor 68 Jahren (1958) baute William Higinbotham Tennis for Two auf einem Oszilloskop.",

/* 70 */ "Vor 70 Jahren (1956) wurde bei der Dartmouth-Konferenz der Begriff „Künstliche Intelligenz“ geprägt – deine NPCs danken."
];

const START = Date.UTC(2026, 10, 12);  // 12.11.2026 = 0 % Fortschritt
const END   = Date.UTC(2027, 0, 21);   // 21.01.2027: der Hammer fällt
const AFTER = Date.UTC(2027, 0, 24);   // 24.01.2027: Hammer wieder oben, es regnet
const DAY = 86400000;
const RAIN_TEXT = "Der Hammer ist gefallen – jetzt hängt er wieder oben und es regnet. Insert Coin, um es noch einmal zu versuchen.";

// Geheimcodes: "johnny" simuliert 0 Tage (Party-Phase), "karete" die Regen-Phase.
// Derselbe Code nochmal = zurück zur echten Phase.
const CODES = { johnny: "party", karete: "rain" };
let override = null;
let typed = "";
window.addEventListener("keydown", e => {
  if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;
  typed = (typed + e.key.toLowerCase()).slice(-6);
  const phase = CODES[typed];
  if (phase) { override = override === phase ? null : phase; typed = ""; update(); }
});

// Regen
const canvas = document.getElementById("rain");
const ctx = canvas.getContext("2d");
let drops = [], raining = false;
function resizeRain() {
  canvas.width = Math.ceil(innerWidth / 4);   // grobe Pixel
  canvas.height = Math.ceil(innerHeight / 4);
  drops = Array.from({ length: Math.ceil(canvas.width / 2.5) }, () => ({
    x: Math.floor(Math.random() * canvas.width),
    y: Math.random() * canvas.height,
    v: 1 + Math.random() * 1.5,
    l: 2 + Math.floor(Math.random() * 3)
  }));
}
function rainFrame() {
  if (!raining) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#7ab8ff";
  for (const d of drops) {
    ctx.fillRect(d.x, Math.floor(d.y), 1, d.l);
    d.y += d.v;
    if (d.y > canvas.height) { d.y = -d.l; d.x = Math.floor(Math.random() * canvas.width); }
  }
  requestAnimationFrame(rainFrame);
}
function setRain(on) {
  if (on === raining) return;
  raining = on;
  if (on) { resizeRain(); rainFrame(); }
}

function currentPhase(today) {
  if (override) return override;
  if (today >= AFTER) return "rain";
  if (today >= END) return "party";
  return "count";
}

function update() {
  const now = new Date();
  const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const phase = currentPhase(today);
  const left = phase === "count" ? Math.max(1, Math.round((END - today) / DAY)) : 0;
  const progress = phase === "party" ? 1 : phase === "rain" ? 0
    : Math.min(1, Math.max(0, (today - START) / (END - START)));

  document.body.classList.toggle("party", phase === "party");
  document.body.classList.toggle("rain", phase === "rain");
  setRain(phase === "rain");

  document.getElementById("days").textContent = phase === "party" ? "🚀" : phase === "rain" ? "?" : left;
  document.getElementById("label").textContent = left === 1 ? "Tag" : "Tage";
  document.getElementById("pct").textContent = Math.round(progress * 100) + " %";
  document.getElementById("fill").style.width = (progress * 100) + "%";
  document.getElementById("trivia").textContent =
    phase === "rain" ? RAIN_TEXT : TRIVIA[Math.min(left, TRIVIA.length - 1)];

  const stage = document.getElementById("stage");
  document.getElementById("hammer").style.transform = `rotate(${progress * 90}deg)`;
  drawGauge(progress);
  stage.classList.remove("hit");
  if (phase === "party") { void stage.offsetWidth; stage.classList.add("hit"); }
}
window.addEventListener("resize", () => { update(); if (raining) resizeRain(); });
window.addEventListener("load", update);
update();
setInterval(update, 60 * 1000);
</script>
</body>
</html>
